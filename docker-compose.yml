services:
  db:
    image: postgres:16-alpine
    container_name: lawfirm-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lawfirm}
      POSTGRES_USER: ${POSTGRES_USER:-lawfirm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    name: lawfirm-postgres-data
