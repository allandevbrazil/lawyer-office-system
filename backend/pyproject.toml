[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lawfirm-backend"
version = "0.1.0"
description = "LawFirm backoffice ERP API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "email-validator>=2.2,<3.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.29,<1.0",
  "alembic>=1.14,<2.0",
  "pyjwt[crypto]>=2.9,<3.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "python-multipart>=0.0.12,<1.0",
  "httpx>=0.27,<1.0",
  "resend>=2.0,<3.0",
  "supabase>=2.10,<3.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.8,<1.0",
  "mypy>=1.13,<2.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/api/*.py" = ["B008"]
